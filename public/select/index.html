<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0f14" />
  <title>Rameur — Choisir une vidéo</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="select.css" />
</head>
<body>
  <main>
    <h1>Choisir une vidéo</h1>

    <!-- Vue par défaut : choix de plateforme -->
    <section id="home">
      <p class="lead">1. Ouvre une plateforme et copie le lien de ta vidéo
        (<strong>Partager → Copier le lien</strong>).<br>
        2. Reviens ici et appuie sur <strong>Coller et lancer</strong>.</p>
      <div class="platforms">
        <a class="card yt" href="https://m.youtube.com/" target="_blank" rel="noopener">YouTube</a>
        <a class="card arte" href="https://www.arte.tv/fr/" target="_blank" rel="noopener">ARTE</a>
      </div>

      <section class="paste-block">
        <button id="clip-btn" type="button" class="clip">📋 Coller et lancer</button>
        <p id="clip-hint" class="clip-hint" hidden></p>
        <form id="paste-form">
          <input id="paste-input" type="url" inputmode="url"
                 placeholder="…ou colle le lien ici à la main" />
          <button type="submit">Lancer</button>
        </form>
      </section>
    </section>

    <!-- Vue confirmation après envoi -->
    <section id="result" hidden>
      <div class="result-card">
        <p id="result-msg"></p>
        <button id="back-btn" type="button">Choisir une autre vidéo</button>
      </div>
    </section>
  </main>

  <script src="select.js"></script>
</body>
</html>
